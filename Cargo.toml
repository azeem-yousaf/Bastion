[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# IronRDP protocol stack (versions must stay mutually compatible; sspi pinned to match picky rc.26)
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-tokio = { version = "0.12", features = ["reqwest"] }
ironrdp-pdu = "0.11"
ironrdp-core = "0.3"
ironrdp-svc = "0.10"
ironrdp-dvc = "0.10"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-egfx = "0.5"
ironrdp-displaycontrol = "0.10"
ironrdp-rdpsnd = "0.11"
ironrdp-rdpeai = "0.2"
ironrdp-cliprdr = "0.9"
ironrdp-cliprdr-format = "0.3"
ironrdp-rdpdr = "0.9"
ironrdp-rdpdr-native = "0.9"
ironrdp-rdpfile = "0.1"
ironrdp-propertyset = "0.1"
ironrdp-mstsgu = { version = "0.1", features = ["rustls"] }
ironrdp-tls = { version = "0.3", features = ["rustls"] }
sspi = "=0.23.0"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tokio-rustls = "0.26"
rustls = "0.23"
x509-cert = "0.3"
rustls-native-certs = "0.8"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
smallvec = "1"
winit = "0.30"
wgpu = "30"
egui = { version = "0.37", features = ["default_fonts", "monochrome_emoji_fonts"] }
egui-winit = "0.37"
egui-wgpu = "0.37"
ffmpeg-next = "9.1"
libpulse-binding = "2.30"
libpulse-simple-binding = "2.29"

bastion-core = { path = "crates/bastion-core" }
bastion-session = { path = "crates/bastion-session" }
bastion-audio = { path = "crates/bastion-audio" }
bastion-clipboard = { path = "crates/bastion-clipboard" }
bastion-video = { path = "crates/bastion-video" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.dev.package."*"]
opt-level = 2
